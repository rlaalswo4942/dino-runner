<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Dino Runner</title>
<style>
  body { margin:0; display:flex; justify-content:center; align-items:center; height:100vh; background:#f7f7f7; font-family:sans-serif; }
  canvas { background:#fff; border-bottom:2px solid #535353; }
  #hint { position:fixed; bottom:20px; color:#777; font-size:14px; }
</style>
</head>
<body>
<canvas id="game" width="800" height="200"></canvas>
<div id="hint">Space / ↑ : 점프 · 게임오버 후 Space로 재시작</div>
<script>
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const GROUND_Y = 160;

const BASE_SPEED = 1.5;
const MIN_SPEED = BASE_SPEED * 0.2;
const MAX_SPEED = BASE_SPEED * 1.5;
const RAMP_SECONDS = 1200; // 최저 속도 -> 최고 속도까지 20분

const GRAVITY = 0.6;
const MAX_JUMP_HEIGHT = 240; // 기존 점프 높이(120)의 2배
const MIN_JUMP_HEIGHT = 60;  // 기존 점프 높이(120)의 절반
const MAX_JUMP_V = Math.sqrt(2 * GRAVITY * MAX_JUMP_HEIGHT); // 길게 누를 때
const MIN_JUMP_V = Math.sqrt(2 * GRAVITY * MIN_JUMP_HEIGHT); // 짧게 누를 때 컷 높이

const BLOCK_W = 20, BLOCK_H = 30; // 기존 블럭 기준값
const BLOCK_MAX = { w: BLOCK_W * 2.5, h: BLOCK_H * 2 };
const BLOCK_MIN = { w: BLOCK_W, h: BLOCK_H * 0.5 };

let dino, obstacles, speed, score, best, running, gameOverFlag, spawnTimer, startTime;

function reset() {
  dino = { x:50, y:GROUND_Y-40, w:40, h:40, vy:0, jumping:false };
  obstacles = [];
  speed = MIN_SPEED;
  score = 0;
  running = true;
  gameOverFlag = false;
  spawnTimer = 0;
  startTime = null;
}

best = Number(localStorage.getItem('dinoBest') || 0);
reset();

function jump() {
  if (!dino.jumping && running) {
    dino.vy = -MAX_JUMP_V;
    dino.jumping = true;
  }
}

function cutJump() {
  if (dino.jumping && dino.vy < -MIN_JUMP_V) dino.vy = -MIN_JUMP_V;
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (gameOverFlag) reset(); else jump();
  }
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') cutJump();
});
cv.addEventListener('mousedown', () => { if (gameOverFlag) reset(); else jump(); });
cv.addEventListener('mouseup', cutJump);

function spawnObstacle() {
  const preset = Math.random() < 0.5 ? BLOCK_MAX : BLOCK_MIN;
  obstacles.push({ x: cv.width, y: GROUND_Y - preset.h, w: preset.w, h: preset.h });
}

function collide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function update(elapsedSeconds) {
  if (!running) return;

  const progress = Math.min(elapsedSeconds / RAMP_SECONDS, 1);
  speed = MIN_SPEED + (MAX_SPEED - MIN_SPEED) * progress;

  dino.vy += GRAVITY;
  dino.y += dino.vy;
  if (dino.y >= GROUND_Y - dino.h) {
    dino.y = GROUND_Y - dino.h;
    dino.vy = 0;
    dino.jumping = false;
  }

  spawnTimer--;
  if (spawnTimer <= 0) {
    spawnObstacle();
    spawnTimer = 60 + Math.random()*60;
  }

  obstacles.forEach(o => o.x -= speed);
  obstacles = obstacles.filter(o => o.x + o.w > 0);

  for (const o of obstacles) {
    if (collide(dino, o)) {
      running = false;
      gameOverFlag = true;
      best = Math.max(best, Math.floor(score));
      localStorage.setItem('dinoBest', best);
    }
  }

  score += 0.15;
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);

  ctx.strokeStyle = '#535353';
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(cv.width, GROUND_Y);
  ctx.stroke();

  ctx.fillStyle = '#535353';
  ctx.fillRect(dino.x, dino.y, dino.w, dino.h);

  obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.w, o.h));

  ctx.fillStyle = '#535353';
  ctx.font = '16px monospace';
  ctx.fillText('SCORE ' + Math.floor(score).toString().padStart(5,'0'), cv.width-180, 20);
  ctx.fillText('BEST ' + best.toString().padStart(5,'0'), cv.width-180, 40);

  if (gameOverFlag) {
    ctx.textAlign = 'center';
    ctx.font = '24px monospace';
    ctx.fillText('GAME OVER', cv.width/2, cv.height/2);
    ctx.font = '14px monospace';
    ctx.fillText('Space로 재시작', cv.width/2, cv.height/2+24);
    ctx.textAlign = 'left';
  }
}

function loop(ts) {
  if (startTime === null) startTime = ts;
  update((ts - startTime) / 1000);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
