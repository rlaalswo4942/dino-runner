<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Dino Runner</title>
<style>
  body { margin:0; display:flex; justify-content:center; align-items:center; height:100vh; background:#f7f7f7; font-family:sans-serif; }
  canvas { background:#fff; border-bottom:2px solid #535353; }
  #hint { position:fixed; bottom:20px; color:#777; font-size:14px; }
</style>
</head>
<body>
<canvas id="game" width="800" height="200"></canvas>
<div id="hint">Space / ↑ : 점프 · 게임오버 후 Space로 재시작</div>
<script>
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const GROUND_Y = 160;

const BASE_SPEED = 1.5 * 1.5 * 2.5;
const MIN_SPEED = BASE_SPEED * 0.2 * 3; // 시작 속도 3배
const MAX_SPEED = BASE_SPEED * 1.5;
const RAMP_SECONDS = 1200; // 최저 속도 -> 최고 속도까지 20분

let dino, obstacles, speed, score, best, running, gameOverFlag, spawnTimer, startTime;

function reset() {
  dino = { x:50, y:GROUND_Y-40, w:40, h:40, vy:0, jumping:false };
  obstacles = [];
  speed = MIN_SPEED;
  score = 0;
  running = true;
  gameOverFlag = false;
  spawnTimer = 0;
  startTime = null;
}

best = Number(localStorage.getItem('dinoBest') || 0);
reset();

function jump() {
  if (!dino.jumping && running) {
    dino.vy = -12;
    dino.jumping = true;
  }
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (gameOverFlag) reset(); else jump();
  }
});
cv.addEventListener('mousedown', () => { if (gameOverFlag) reset(); else jump(); });

function spawnObstacle() {
  const h = 30 + Math.random()*20;
  obstacles.push({ x: cv.width, y: GROUND_Y - h, w: 20, h });
}

function collide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

const HITBOX_PAD = 0.35; // 히트박스 각 축 35%씩 안쪽으로 축소
function getHitbox(e) {
  const padW = e.w * HITBOX_PAD, padH = e.h * HITBOX_PAD;
  return { x: e.x + padW/2, y: e.y + padH/2, w: e.w - padW, h: e.h - padH };
}

function update(elapsedSeconds) {
  if (!running) return;

  const progress = Math.min(elapsedSeconds / RAMP_SECONDS, 1);
  speed = MIN_SPEED + (MAX_SPEED - MIN_SPEED) * progress;

  dino.vy += 0.6;
  dino.y += dino.vy;
  if (dino.y >= GROUND_Y - dino.h) {
    dino.y = GROUND_Y - dino.h;
    dino.vy = 0;
    dino.jumping = false;
  }

  spawnTimer--;
  if (spawnTimer <= 0) {
    spawnObstacle();
    spawnTimer = 60 + Math.random()*60;
  }

  obstacles.forEach(o => o.x -= speed);
  obstacles = obstacles.filter(o => o.x + o.w > 0);

  const dinoBox = getHitbox(dino);
  for (const o of obstacles) {
    if (collide(dinoBox, o)) {
      running = false;
      gameOverFlag = true;
      best = Math.max(best, Math.floor(score));
      localStorage.setItem('dinoBest', best);
    }
  }

  score += 0.15;
}

function drawNinja(x, y, w, h, jumping) {
  const legSwing = jumping ? 0.5 : Math.sin(performance.now() * 0.02) * 0.5;

  ctx.save();
  ctx.fillStyle = '#111';
  ctx.translate(x + w/2, y + h/2);

  ctx.save();
  ctx.rotate(0.15);
  ctx.fillRect(-w*0.18, -h*0.35, w*0.36, h*0.45);
  ctx.restore();

  ctx.beginPath();
  ctx.arc(w*0.12, -h*0.38, w*0.16, 0, Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(-w*0.02, -h*0.42);
  ctx.lineTo(-w*0.35, -h*0.55);
  ctx.lineTo(-w*0.2, -h*0.3);
  ctx.closePath();
  ctx.fill();

  ctx.save();
  ctx.translate(-w*0.05, h*0.05);
  ctx.rotate(-legSwing - 0.3);
  ctx.fillRect(-w*0.08, 0, w*0.16, h*0.5);
  ctx.restore();

  ctx.save();
  ctx.translate(w*0.05, h*0.05);
  ctx.rotate(legSwing + 0.3);
  ctx.fillRect(-w*0.08, 0, w*0.16, h*0.5);
  ctx.restore();

  ctx.save();
  ctx.translate(w*0.15, -h*0.1);
  ctx.rotate(-legSwing*0.6 - 0.4);
  ctx.fillRect(-w*0.06, 0, w*0.12, h*0.32);
  ctx.restore();

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);

  ctx.strokeStyle = '#535353';
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(cv.width, GROUND_Y);
  ctx.stroke();

  drawNinja(dino.x, dino.y, dino.w, dino.h, dino.jumping);

  obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.w, o.h));

  ctx.fillStyle = '#535353';
  ctx.font = '16px monospace';
  ctx.fillText('SCORE ' + Math.floor(score).toString().padStart(5,'0'), cv.width-180, 20);
  ctx.fillText('BEST ' + best.toString().padStart(5,'0'), cv.width-180, 40);

  if (gameOverFlag) {
    ctx.textAlign = 'center';
    ctx.font = '24px monospace';
    ctx.fillText('GAME OVER', cv.width/2, cv.height/2);
    ctx.font = '14px monospace';
    ctx.fillText('Space로 재시작', cv.width/2, cv.height/2+24);
    ctx.textAlign = 'left';
  }
}

function loop(ts) {
  if (startTime === null) startTime = ts;
  update((ts - startTime) / 1000);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
